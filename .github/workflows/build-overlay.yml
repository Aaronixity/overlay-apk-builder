name: Build Overlay APK

on:
  workflow_dispatch:
    inputs:
      theme_mode:
        description: "system or custom"
        required: true
        default: "system"
      accent_hex:
        description: "Accent hex color"
        required: true
        default: "#1E88E5"
      app_name:
        description: "Android app name"
        required: true
        default: "Test Overlay"
      xml_mode:
        description: "default_xml, custom_xml, or from_code"
        required: true
        default: "default_xml"
      custom_xml_b64:
        description: "Base64 custom XML layout"
        required: false
        default: ""
      min_sdk:
        description: "minSdkVersion"
        required: true
        default: "21"
      target_sdk:
        description: "targetSdkVersion"
        required: true
        default: "34"
      overlay_type_26plus:
        description: "API 26+ overlay type"
        required: true
        default: "TYPE_APPLICATION_OVERLAY"
      legacy_type:
        description: "TYPE_PHONE or TYPE_SYSTEM_ERROR"
        required: true
        default: "TYPE_PHONE"
      extra_cfg:
        description: "Semicolon key=val flags"
        required: false
        default: "icon=default;alpha=1.0;gravity=CENTER;flags=FLAG_NOT_FOCUSABLE;close=1;drag=1;auto=0;vib=0;wakelock=0;wl_level=PARTIAL_WAKE_LOCK;kg=0;kg_mode=DISMISS;destroy=destroy overlay;sign=debug_sign"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Config to Android Project
        run: |
          python3 - << 'EOF'
          import os
          import re
          import base64
          from pathlib import Path

          theme_mode = os.environ.get("INPUT_THEME_MODE", "system")
          accent_hex = os.environ.get("INPUT_ACCENT_HEX", "#1E88E5")
          app_name = os.environ.get("INPUT_APP_NAME", "Test Overlay")
          xml_mode = os.environ.get("INPUT_XML_MODE", "default_xml")
          custom_xml_b64 = os.environ.get("INPUT_CUSTOM_XML_B64", "")
          min_sdk = os.environ.get("INPUT_MIN_SDK", "21")
          target_sdk = os.environ.get("INPUT_TARGET_SDK", "34")
          overlay_type_26plus = os.environ.get("INPUT_OVERLAY_TYPE_26PLUS", "TYPE_APPLICATION_OVERLAY")
          legacy_type = os.environ.get("INPUT_LEGACY_TYPE", "TYPE_PHONE")
          extra_raw = os.environ.get("INPUT_EXTRA_CFG", "")

          kv = {}
          for part in extra_raw.split(";"):
              if "=" in part:
                  k, v = part.split("=", 1)
                  kv[k.strip()] = v.strip()

          icon_mode = kv.get("icon", "default")
          alpha_val = kv.get("alpha", "1.0")
          gravity_expr = " | ".join(
              f"android.view.Gravity.{g.strip()}"
              for g in kv.get("gravity", "CENTER").split("|")
              if g.strip()
          ) or "android.view.Gravity.CENTER"

          flag_tokens = [f.strip() for f in kv.get("flags", "").split("|") if f.strip() and f.strip() != "0"]
          flags_expr = " | ".join(
              f"android.view.WindowManager.LayoutParams.{f}" for f in flag_tokens
          ) or "0"

          close_btn = kv.get("close", "1") == "1"
          draggable = kv.get("drag", "1") == "1"
          auto_start = kv.get("auto", "0") == "1"
          vibrate = kv.get("vib", "0") == "1"
          wake_lock = kv.get("wakelock", "0") == "1"
          wl_level = kv.get("wl_level", "PARTIAL_WAKE_LOCK")
          keyguard = kv.get("kg", "0") == "1"
          kg_mode = kv.get("kg_mode", "DISMISS")
          destroy_phrase = kv.get("destroy", "destroy overlay").replace("\\", "\\\\").replace('"', '\\"')
          safe_app_name = app_name.replace("&", "&amp;").replace("<", "&lt;").replace('"', "&quot;")

          gradle_path = Path("app/build.gradle")
          if gradle_path.exists():
              gtxt = gradle_path.read_text(encoding="utf-8")
              gtxt = re.sub(r"minSdk\s+\d+", f"minSdk {min_sdk}", gtxt)
              gtxt = re.sub(r"minSdkVersion\s+\d+", f"minSdkVersion {min_sdk}", gtxt)
              gtxt = re.sub(r"targetSdk\s+\d+", f"targetSdk {target_sdk}", gtxt)
              gtxt = re.sub(r"targetSdkVersion\s+\d+", f"targetSdkVersion {target_sdk}", gtxt)
              gradle_path.write_text(gtxt, encoding="utf-8")

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              mtxt = manifest_path.read_text(encoding="utf-8")
              if "SYSTEM_ALERT_WINDOW" not in mtxt:
                  mtxt = mtxt.replace(
                      "<application",
                      '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <application',
                      1,
                  )
              if wake_lock and "WAKE_LOCK" not in mtxt:
                  mtxt = mtxt.replace(
                      "<application",
                      '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application',
                      1,
                  )
              manifest_path.write_text(mtxt, encoding="utf-8")

          values_dir = Path("app/src/main/res/values")
          values_dir.mkdir(parents=True, exist_ok=True)
          (values_dir / "overlay_generated.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              "<resources>\n"
              f'    <string name="app_name">{safe_app_name}</string>\n'
              f'    <color name="overlay_accent">{accent_hex}</color>\n'
              f'    <string name="overlay_theme_mode">{theme_mode}</string>\n'
              "</resources>\n",
              encoding="utf-8",
          )

          if icon_mode == "none":
              for p in Path("app/src/main/res").glob("mipmap-*/ic_launcher*"):
                  if p.exists():
                      p.unlink()

          layout_dir = Path("app/src/main/res/layout")
          layout_dir.mkdir(parents=True, exist_ok=True)
          if xml_mode == "custom_xml" and custom_xml_b64:
              (layout_dir / "overlay_view.xml").write_bytes(base64.b64decode(custom_xml_b64))

          java_dir = Path("app/src/main/java/com/example/overlay")
          java_dir.mkdir(parents=True, exist_ok=True)
          config_java = (
              "package com.example.overlay;\n\n"
              "public class OverlayConfig {\n"
              f'    public static final String THEME_MODE = "{theme_mode}";\n'
              f'    public static final String ACCENT_HEX = "{accent_hex}";\n'
              f'    public static final String XML_MODE = "{xml_mode}";\n'
              f"    public static final int OVERLAY_TYPE_26_PLUS = android.view.WindowManager.LayoutParams.{overlay_type_26plus};\n"
              f"    public static final int LEGACY_WINDOW_TYPE = android.view.WindowManager.LayoutParams.{legacy_type};\n"
              f"    public static final int GRAVITY = {gravity_expr};\n"
              f"    public static final int EXTRA_FLAGS = {flags_expr};\n"
              f"    public static final float ALPHA = {alpha_val}f;\n"
              f"    public static final boolean SHOW_CLOSE_BTN = {str(close_btn).lower()};\n"
              f"    public static final boolean DRAGGABLE = {str(draggable).lower()};\n"
              f"    public static final boolean AUTO_START = {str(auto_start).lower()};\n"
              f"    public static final boolean VIBRATE = {str(vibrate).lower()};\n"
              f"    public static final boolean WAKE_LOCK_ENABLED = {str(wake_lock).lower()};\n"
              f"    public static final int WAKE_LOCK_FLAG = android.os.PowerManager.{wl_level};\n"
              f"    public static final boolean KEYGUARD_ENABLED = {str(keyguard).lower()};\n"
              f'    public static final String KEYGUARD_MODE = "{kg_mode}";\n'
              f'    public static final String DESTROY_PHRASE = "{destroy_phrase}";\n'
              "}\n"
          )
          (java_dir / "OverlayConfig.java").write_text(config_java, encoding="utf-8")
          EOF
        env:
          INPUT_THEME_MODE: ${{ inputs.theme_mode }}
          INPUT_ACCENT_HEX: ${{ inputs.accent_hex }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_XML_MODE: ${{ inputs.xml_mode }}
          INPUT_CUSTOM_XML_B64: ${{ inputs.custom_xml_b64 }}
          INPUT_MIN_SDK: ${{ inputs.min_sdk }}
          INPUT_TARGET_SDK: ${{ inputs.target_sdk }}
          INPUT_OVERLAY_TYPE_26PLUS: ${{ inputs.overlay_type_26plus }}
          INPUT_LEGACY_TYPE: ${{ inputs.legacy_type }}
          INPUT_EXTRA_CFG: ${{ inputs.extra_cfg }}

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Apply Signing Mode
        run: |
          python3 - << 'EOF'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          extra_raw = os.environ.get("INPUT_EXTRA_CFG", "")
          kv = {}
          for part in extra_raw.split(";"):
              if "=" in part:
                  k, v = part.split("=", 1)
                  kv[k.strip()] = v.strip()

          sign_mode = kv.get("sign", "debug_sign")
          apk_src = Path("app/build/outputs/apk/debug/app-debug.apk")
          out_dir = Path("build_out")
          out_dir.mkdir(exist_ok=True)
          apk_dst = out_dir / "final-overlay.apk"
          shutil.copy2(apk_src, apk_dst)

          if sign_mode == "unsigned":
              subprocess.run(["zip", "-d", str(apk_dst), "META-INF/*"], check=False)
          EOF
        env:
          INPUT_EXTRA_CFG: ${{ inputs.extra_cfg }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-apk
          path: build_out/final-overlay.apk
